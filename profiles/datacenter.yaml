# Data Center Photonics Profile
# Data Center Quantum Computing - Photonic
# Target: HPC clusters, data center racks, cloud deployments

name: "Data Center Photonics"
tagline: "Data Center Quantum Computing - Photonic"

hardware_backend: "photonic_cloud"

deployment_profiles:
  primary: "hpc_cluster"
  available:
    - "hpc_cluster"
    - "datacenter_rack"
    - "cloud_node"

routing:
  strategy_default: "cost_per_job"
  key_metric: "throughput"
  power_unit: "pue_adjusted"      # Power Usage Effectiveness

energy_model:
  framing: "PUE"
  label: "Data Center Energy Efficiency"
  warn_threshold_pct: 90

demo_scenarios:
  - name: "Drug Discovery Sampling"
    file: "examples/scenarios/datacenter/pharma_optimization.json"
  - name: "Financial Risk Modeling"
    file: "examples/scenarios/datacenter/portfolio_risk.json"
  - name: "Hydrology Simulation"
    file: "examples/scenarios/datacenter/hydrology.json"

docs:
  integration: "docs/datacenter-integration.md"
  pitch_focus: "Data center integration, cloud API, HPC workflows"
